# Used only by tests annotated with @ActiveProfiles("test").
# Everything else (DB user, DB_PASSWORD, JWT_SECRET) is inherited from application.properties,
# so no passwords are stored here.

# A SEPARATE database, so smartpay_db is never touched by these tests.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/smartpay_test_db?createDatabaseIfNotExist=true

# Hibernate builds the tables in the test database before the tests run.
spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
